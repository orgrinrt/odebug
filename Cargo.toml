[package]
name = "odebug"
authors = ["orgrinrt", "Hiisi Digital"]
version = "0.2.0"
edition = "2021"
# notko is edition 2024 and declares 1.85, and taking the receive contract from it brings that
# floor along. 1.70 was already a claim consumers could not act on: `core::ptr::from_ref` is
# 1.76 and `clear_poison` is 1.77, both of which this crate uses.
rust-version = "1.85"
description = """
Debug logging utility that writes to text files, practical especially during proc-macro compilation.
"""
license = "MPL-2.0"
readme = "README.md"
keywords = ["debug", "logging", "proc-macro", "development", "file-logger"]
categories = ["development-tools", "development-tools::procedural-macro-helpers", "development-tools::debugging", "development-tools::testing"]
documentation = "https://docs.rs/odebug"
homepage = "https://github.com/orgrinrt/odebug"
repository = "https://github.com/orgrinrt/odebug"

[dependencies]
# The receive contract a sink implements: `Emit<Entry>` is `notko::sink::Emit`, so this crate
# does not declare a receive trait of its own. notko is not on crates.io yet, so this is a git
# dependency, and it tracks `dev` rather than a feature branch, so a merge upstream does not
# break this build the instant it lands.
notko = { git = "https://github.com/orgrinrt/notko.git", branch = "dev", version = "0.0.1", default-features = false }

[features]
default = ["use_workspace", "output_to_target"]
use_workspace = []
output_to_target = []
always_log = []
# Keeps each file open behind a buffer. Much faster and loses whatever is unflushed
# if the process dies, which for a debug log is when it matters most.
buffered = []
test_suite_a = []
test_suite_b = ["use_workspace"]
test_suite_c = ["output_to_target"]
# Compiles the file writer out, along with the three flags that only say where it puts
# its files. What is left is the macro and the `Sink` contract, and a consumer installs
# whatever it has: a serial port, a ring buffer in RAM, a semihosting channel.
#
# Nothing is installed by default under this, because there is nothing sensible to
# default to. An entry written before a sink is installed is reported as a refusal and
# dropped, which is what a debug log should do rather than halt the program it is
# debugging.
no_std = []
# Implies `no_std`. The macro builds no `String` under any selection: an entry is a
# `core::fmt::Arguments` and the sink formats it into wherever it writes. So this adds
# nothing and takes nothing away, and states that the path from a call to a sink
# allocates nowhere.
no_alloc = ["no_std"]

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "write"
harness = false

